name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Manifests, skills and verdict vocabulary
        run: python3 scripts/check_plugin.py
      - name: Claude plugin schema (strict)
        run: npx -y @anthropic-ai/claude-code plugin validate --strict .
